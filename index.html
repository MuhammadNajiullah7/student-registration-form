<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-container">
        <h1>Student Registration Form</h1>
        <p class="subtitle">University Admission Portal</p>

        <form action="#" method="post" enctype="multipart/form-data">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Enter your full name" autocomplete="name" required>

            <label for="fatherName">Father's Name:</label>
            <input type="text" id="fatherName" name="fatherName"
                   placeholder="Enter father's name" required>

            <label for="regNumber">Registration Number:</label>
            <input type="text" id="regNumber" name="regNumber"
                   placeholder="e.g. 2601038" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@email.com" autocomplete="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" autocomplete="new-password" required>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Confirm your password" autocomplete="new-password" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <span class="field-label">Gender:</span>
            <div class="gender-options">
                <label class="option-label"><input type="radio" name="gender" value="Male" required> Male</label>
                <label class="option-label"><input type="radio" name="gender" value="Female"> Female</label>
                <label class="option-label"><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="BSSE">BSSE</option>
                <option value="BSAI">BSAI</option>
                <option value="BSDS">BSDS</option>
                <option value="BSCS">BSCS</option>
            </select>

            <label for="semester">Semester:</label>
            <select id="semester" name="semester" required>
                <option value="">Select Semester</option>
                <option value="1">1st Semester</option>
                <option value="2">2nd Semester</option>
                <option value="3">3rd Semester</option>
                <option value="4">4th Semester</option>
                <option value="5">5th Semester</option>
                <option value="6">6th Semester</option>
                <option value="7">7th Semester</option>
                <option value="8">8th Semester</option>
            </select>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="e.g. 03001234567" autocomplete="tel" required>

            <label for="address">Permanent Address:</label>
            <textarea id="address" name="address"
                      placeholder="Enter your permanent address"
                      rows="3" autocomplete="street-address" required></textarea>

            <label for="picture">Profile Picture:</label>
            <input type="file" id="picture" name="picture"
                   accept="image/*" required>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the Terms and Conditions.</label>
            </div>

            <div class="button-group">
                <button type="submit" class="register-btn">Register</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>
        </form>
    </main>
</body>
</html>
